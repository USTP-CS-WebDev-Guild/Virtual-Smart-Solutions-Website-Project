name: encrypted Supabase backup

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-encrypt-store:
    # Enable ONLY in the restricted team/client operations repository.
    # No private paid GitHub environment/approval feature is required.
    if: vars.ENABLE_PRODUCTION_BACKUP == 'true' && github.event.repository.private && github.repository == vars.PRODUCTION_BACKUP_REPOSITORY
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: encrypted-production-backup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Export app schema AND data, then encrypt
        run: npm exec --yes --package=supabase@2.122.0 -- node devops/scripts/backup-database.mjs "$RUNNER_TEMP/vss.sql.enc"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Store encrypted backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vss-weekly-${{ github.run_id }}
          path: ${{ runner.temp }}/vss.sql.enc
          if-no-files-found: error
          retention-days: 14
